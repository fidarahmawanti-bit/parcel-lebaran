<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="corpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF8FD"/>
      <stop offset="100%" stop-color="#DCECF7"/>
    </linearGradient>
    <linearGradient id="corpBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#153B5B"/>
      <stop offset="100%" stop-color="#0E273D"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEECB"/>
      <stop offset="50%" stop-color="#D9B56D"/>
      <stop offset="100%" stop-color="#AA7F32"/>
    </linearGradient>
    <linearGradient id="sleeveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFF8FD"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="cShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#153B5B" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#corpBg)"/>

  <!-- Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="140" height="30" rx="15" fill="#153B5B"/>
    <text x="70" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#69BCEB" text-anchor="middle" letter-spacing="1">KORPORAT / B2B</text>
  </g>

  <!-- Corporate Box Display -->
  <g filter="url(#cShadow)" transform="translate(100, 75)">
    <!-- Main Rigid Executive Box -->
    <rect x="20" y="150" width="360" height="180" rx="14" fill="url(#corpBox)"/>
    <!-- Gold Edge Inlay -->
    <rect x="20" y="150" width="360" height="5" rx="2" fill="url(#goldAcc)"/>

    <!-- Custom Branded Corporate Sleeve around center -->
    <rect x="130" y="145" width="140" height="190" rx="4" fill="url(#sleeveGrad)" stroke="#DCEAF2" stroke-width="1.5"/>
    <rect x="145" y="160" width="110" height="35" rx="6" fill="#153B5B"/>
    <circle cx="165" cy="177" r="8" fill="url(#goldAcc)"/>
    <text x="180" y="181" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">YOUR LOGO</text>
    <text x="200" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#153B5B" text-anchor="middle">EID AL-FITR 2026</text>
    <text x="200" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#607586" text-anchor="middle">Corporate Appreciation</text>
    <text x="200" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#278CC8" text-anchor="middle">PT Mitra Nusantara Tbk</text>

    <!-- Executive Items protruding/arranged neatly -->
    <!-- Smart Temperature Tumbler (Matte Black & Gold) -->
    <g transform="translate(50, 45)">
      <rect x="10" y="20" width="45" height="130" rx="10" fill="#1E293B"/>
      <!-- LED Cap -->
      <rect x="12" y="10" width="41" height="15" rx="5" fill="#0F172A" stroke="url(#goldAcc)" stroke-width="1.5"/>
      <text x="32" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#69BCEB" text-anchor="middle">55°C</text>
      <!-- Base Trim -->
      <rect x="10" y="140" width="45" height="6" rx="2" fill="url(#goldAcc)"/>
      <text x="32" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#94A3B8" text-anchor="middle" transform="rotate(-90 32 90)">VACUUM FLASK</text>
    </g>

    <!-- Luxury Tin Canister of Premium Dates (Al-Qassim Sukari) -->
    <g transform="translate(115, 60)">
      <rect x="5" y="15" width="70" height="95" rx="8" fill="#1C4B72" stroke="url(#goldAcc)" stroke-width="1.5"/>
      <rect x="3" y="8" width="74" height="12" rx="4" fill="url(#goldAcc)"/>
      <text x="40" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF" text-anchor="middle">SUKARI</text>
      <text x="40" y="67" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#D9B56D" text-anchor="middle">PREMIUM DATES</text>
      <text x="40" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="500" fill="#EFF8FD" text-anchor="middle">Netto: 250g</text>
    </g>

    <!-- Glass Jar of Gourmet Almond Cookies -->
    <g transform="translate(260, 50)">
      <rect x="10" y="25" width="75" height="95" rx="12" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
      <rect x="13" y="14" width="69" height="15" rx="4" fill="url(#goldAcc)"/>
      <circle cx="35" cy="75" r="11" fill="#F5C344"/>
      <circle cx="60" cy="75" r="11" fill="#F5C344"/>
      <circle cx="48" cy="55" r="11" fill="#F5C344"/>
      <rect x="18" y="80" width="58" height="20" rx="3" fill="#153B5B"/>
      <text x="47" y="93" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">ALMOND CRUNCH</text>
    </g>

    <!-- Executive Greeting Card with Wax Seal -->
    <g transform="translate(280, 160)" filter="url(#cShadow)">
      <rect width="110" height="75" rx="6" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="1.5"/>
      <text x="55" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#153B5B" text-anchor="middle">KARTU UCAPAN</text>
      <text x="55" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#607586" text-anchor="middle">Dengan Tanda Tangan</text>
      <text x="55" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#278CC8" text-anchor="middle">&amp; Logo Direksi</text>
      <!-- Red Wax Seal -->
      <circle cx="95" cy="58" r="12" fill="#B42318"/>
      <circle cx="95" cy="58" r="9" fill="#911A11" stroke="#FCEECB" stroke-width="0.75"/>
    </g>
  </g>
</svg>
