<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ekoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF8FD"/>
      <stop offset="100%" stop-color="#E2F2FB"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7A977"/>
      <stop offset="100%" stop-color="#A56E37"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69BCEB"/>
      <stop offset="100%" stop-color="#278CC8"/>
    </linearGradient>
    <filter id="ekoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#153B5B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#ekoBg)"/>

  <!-- Badge Top Left -->
  <g transform="translate(30, 30)">
    <rect width="130" height="30" rx="15" fill="#278CC8"/>
    <text x="65" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EKONOMIS</text>
  </g>

  <!-- Hamper Structure -->
  <g filter="url(#ekoShadow)" transform="translate(110, 60)">
    <!-- Woven Basket -->
    <path d="M40 180L70 330C72 340 85 350 100 350H280C295 350 308 340 310 330L340 180H40Z" fill="url(#basketGrad)"/>
    <!-- Basket Weave Texture Lines -->
    <path d="M60 210H320M70 245H310M80 280H300M90 315H290" stroke="#7E4D1D" stroke-width="2" opacity="0.4"/>
    <path d="M110 185L135 345M170 185L185 345M220 185L215 345M270 185L245 345" stroke="#7E4D1D" stroke-width="2" opacity="0.3"/>
    
    <!-- Items in Basket -->
    <!-- Syrup Bottle (Marjan Boudoin style) -->
    <g transform="translate(80, 50)">
      <rect x="15" y="35" width="40" height="125" rx="8" fill="#B42318" opacity="0.9"/>
      <rect x="28" y="5" width="14" height="35" rx="3" fill="#B42318"/>
      <rect x="26" y="5" width="18" height="12" rx="2" fill="#D9B56D"/>
      <rect x="18" y="65" width="34" height="60" rx="3" fill="#FFFFFF"/>
      <text x="35" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#B42318" text-anchor="middle">SIRUP</text>
      <text x="35" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" fill="#153B5B" text-anchor="middle">MANIS</text>
    </g>

    <!-- Tin Biscuit (Monde/Butter Cookies style) -->
    <g transform="translate(145, 60)">
      <rect x="10" y="30" width="100" height="100" rx="14" fill="#153B5B" stroke="#D9B56D" stroke-width="2"/>
      <circle cx="60" cy="75" r="28" fill="#278CC8"/>
      <text x="60" y="73" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">BUTTER</text>
      <text x="60" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" fill="#D9B56D" text-anchor="middle">COOKIES</text>
    </g>

    <!-- Tea Box -->
    <g transform="translate(255, 75)">
      <rect x="5" y="25" width="70" height="90" rx="8" fill="#237A57"/>
      <rect x="12" y="45" width="56" height="40" rx="4" fill="#FFFFFF"/>
      <text x="40" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#237A57" text-anchor="middle">PREMIUM</text>
      <text x="40" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="600" fill="#153B5B" text-anchor="middle">TEA BOX</text>
    </g>

    <!-- Cookie Jar Front Left -->
    <g transform="translate(100, 120)">
      <rect x="0" y="20" width="70" height="70" rx="10" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
      <rect x="5" y="10" width="60" height="14" rx="4" fill="#D9B56D"/>
      <circle cx="25" cy="55" r="9" fill="#F5C344"/>
      <circle cx="45" cy="55" r="9" fill="#F5C344"/>
      <circle cx="35" cy="38" r="9" fill="#F5C344"/>
    </g>

    <!-- Cookie Jar Front Right -->
    <g transform="translate(190, 120)">
      <rect x="0" y="20" width="70" height="70" rx="10" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
      <rect x="5" y="10" width="60" height="14" rx="4" fill="#69BCEB"/>
      <rect x="15" y="45" width="18" height="8" rx="2" fill="#FAD06C"/>
      <rect x="37" y="45" width="18" height="8" rx="2" fill="#FAD06C"/>
      <rect x="25" y="32" width="18" height="8" rx="2" fill="#FAD06C"/>
    </g>

    <!-- Clear Plastic / Mesh Wrap & Big Festive Ribbon -->
    <path d="M30 180C30 90 350 90 350 180Z" fill="url(#skyGrad)" opacity="0.15"/>
    <!-- Big Center Sky-Blue Bow -->
    <g transform="translate(190, 180)">
      <ellipse cx="-25" cy="-12" rx="28" ry="16" fill="url(#skyGrad)" transform="rotate(-15)"/>
      <ellipse cx="25" cy="-12" rx="28" ry="16" fill="url(#skyGrad)" transform="rotate(15)"/>
      <circle cx="0" cy="0" r="14" fill="#D9B56D"/>
      <path d="M-5 10L-15 70L0 60L10 70L0 10Z" fill="url(#skyGrad)"/>
    </g>

    <!-- Price Tag Hanging -->
    <g transform="translate(230, 240)">
      <polygon points="0,0 90,0 110,20 90,40 0,40" fill="#FFFFFF" stroke="#278CC8" stroke-width="1.5"/>
      <circle cx="10" cy="20" r="4" fill="#278CC8"/>
      <text x="55" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#607586" text-anchor="middle">PAKET FITRAH</text>
      <text x="55" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#153B5B" text-anchor="middle">Rp 450.000</text>
    </g>
  </g>
</svg>
