<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF8FD"/>
      <stop offset="100%" stop-color="#D5ECF8"/>
    </linearGradient>
    <linearGradient id="boxNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C4B72"/>
      <stop offset="100%" stop-color="#153B5B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEECB"/>
      <stop offset="50%" stop-color="#D9B56D"/>
      <stop offset="100%" stop-color="#AA7F32"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>

  <!-- Rows of elegant corporate hampers ready for dispatch -->
  <g transform="translate(40, 60)">
    <!-- Back Row Boxes -->
    <g opacity="0.75" transform="translate(30, 20) scale(0.85)">
      <rect x="0" y="40" width="130" height="100" rx="8" fill="url(#boxNavy)"/>
      <rect x="55" y="40" width="16" height="100" fill="url(#gold)"/>
      <rect x="150" y="40" width="130" height="100" rx="8" fill="url(#boxNavy)"/>
      <rect x="205" y="40" width="16" height="100" fill="url(#gold)"/>
      <rect x="300" y="40" width="130" height="100" rx="8" fill="url(#boxNavy)"/>
      <rect x="355" y="40" width="16" height="100" fill="url(#gold)"/>
    </g>

    <!-- Middle Row Boxes -->
    <g opacity="0.9" transform="translate(15, 80) scale(0.92)">
      <rect x="0" y="40" width="150" height="120" rx="10" fill="url(#boxNavy)"/>
      <rect x="65" y="40" width="20" height="120" fill="url(#gold)"/>
      <rect x="175" y="40" width="150" height="120" rx="10" fill="url(#boxNavy)"/>
      <rect x="240" y="40" width="20" height="120" fill="url(#gold)"/>
      <rect x="350" y="40" width="150" height="120" rx="10" fill="url(#boxNavy)"/>
      <rect x="415" y="40" width="20" height="120" fill="url(#gold)"/>
    </g>

    <!-- Front Row Feature Box -->
    <g transform="translate(60, 160)">
      <rect x="0" y="20" width="400" height="150" rx="14" fill="url(#boxNavy)" stroke="#DCEAF2" stroke-width="2"/>
      <rect x="185" y="20" width="30" height="150" fill="url(#gold)"/>
      <!-- Custom Client Sleeve -->
      <rect x="120" y="25" width="160" height="140" rx="6" fill="#FFFFFF"/>
      <text x="200" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#153B5B" text-anchor="middle">PT BANK FINANSIAL NUSANTARA</text>
      <text x="200" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#278CC8" text-anchor="middle">Pengadaan 250 Paket Hampers</text>
      <rect x="150" y="95" width="100" height="24" rx="4" fill="#EFF8FD"/>
      <text x="200" y="111" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#237A57" text-anchor="middle">✓ Tuntas &amp; Tepat Waktu</text>
    </g>
  </g>

  <!-- Tag Info Overlay -->
  <g transform="translate(30, 25)">
    <rect width="180" height="30" rx="15" fill="#153B5B"/>
    <text x="90" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#69BCEB" text-anchor="middle">DOKUMENTASI KORPORASI</text>
  </g>
</svg>
