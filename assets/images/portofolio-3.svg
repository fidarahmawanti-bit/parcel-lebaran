<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF8FD"/>
      <stop offset="100%" stop-color="#D9EEF9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEECB"/>
      <stop offset="50%" stop-color="#D9B56D"/>
      <stop offset="100%" stop-color="#AA7F32"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#p3Bg)"/>

  <!-- Badge -->
  <g transform="translate(30, 25)">
    <rect width="180" height="30" rx="15" fill="#D9B56D"/>
    <text x="90" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#153B5B" text-anchor="middle">CUSTOM BESPOKE VIP</text>
  </g>

  <!-- Acrylic Box Hamper Showcase -->
  <g transform="translate(100, 75)">
    <!-- Clear Box Frame -->
    <rect x="20" y="50" width="360" height="250" rx="16" fill="#FFFFFF" stroke="#69BCEB" stroke-width="2.5"/>
    <path d="M25 55L140 55L35 290L25 290Z" fill="#EFF8FD" opacity="0.6"/>

    <!-- Gold Foil Details -->
    <rect x="50" y="80" width="80" height="95" rx="8" fill="#153B5B" stroke="url(#gold)" stroke-width="2"/>
    <text x="90" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#D9B56D" text-anchor="middle">GOLD TEA</text>

    <!-- Porcelain Teacup and Saucer -->
    <g transform="translate(160, 90)">
      <ellipse cx="40" cy="85" rx="36" ry="12" fill="#DCEAF2"/>
      <rect x="15" y="45" width="50" height="40" rx="8" fill="#FFFFFF" stroke="#278CC8" stroke-width="2"/>
      <path d="M65 52C75 52 75 70 65 72" fill="none" stroke="#278CC8" stroke-width="2.5"/>
    </g>

    <!-- Roll of Silk Sajadah -->
    <rect x="250" y="80" width="90" height="120" rx="14" fill="#237A57" stroke="url(#gold)" stroke-width="1.5"/>
    <rect x="275" y="80" width="35" height="120" fill="url(#gold)"/>
    <text x="292" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#153B5B" text-anchor="middle" transform="rotate(-90 292 145)">TURKISH SILK</text>

    <!-- Project Label -->
    <g transform="translate(70, 215)">
      <rect width="260" height="60" rx="8" fill="#EFF8FD" stroke="#69BCEB" stroke-width="1.5"/>
      <text x="130" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#153B5B" text-anchor="middle">Custom Direksi BUMN</text>
      <text x="130" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#278CC8" text-anchor="middle">50 Box Akrilik Exclusive + Sajadah Sutra</text>
    </g>
