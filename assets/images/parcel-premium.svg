<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="premBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF8FD"/>
      <stop offset="100%" stop-color="#D9EEF9"/>
    </linearGradient>
    <linearGradient id="navyBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C4B72"/>
      <stop offset="100%" stop-color="#153B5B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E8BA"/>
      <stop offset="50%" stop-color="#D9B56D"/>
      <stop offset="100%" stop-color="#B88A3C"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69BCEB"/>
      <stop offset="100%" stop-color="#278CC8"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#153B5B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#premBg)"/>

  <!-- Luxury Premium Badge on Top Left -->
  <g transform="translate(30, 30)">
    <rect width="130" height="30" rx="15" fill="#153B5B"/>
    <circle cx="16" cy="15" r="7" fill="url(#gold)"/>
    <text x="32" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#D9B56D" letter-spacing="1">PREMIUM VIP</text>
  </g>

  <!-- Main Luxury Presentation -->
  <g filter="url(#pShadow)" transform="translate(100, 70)">
    <!-- Main Box Container -->
    <rect x="30" y="160" width="340" height="170" rx="16" fill="url(#navyBox)"/>
    <!-- Box Inlay Gold Edge -->
    <rect x="30" y="160" width="340" height="6" rx="3" fill="url(#gold)"/>
    <!-- Ribbon Center -->
    <rect x="185" y="160" width="30" height="170" fill="url(#gold)"/>

    <!-- Premium Items -->
    <!-- Sparkling Bottle -->
    <g transform="translate(70, 40)">
      <rect x="15" y="45" width="46" height="120" rx="10" fill="#237A57"/>
      <rect x="30" y="10" width="16" height="40" rx="4" fill="#237A57"/>
      <rect x="28" y="8" width="20" height="25" rx="3" fill="url(#gold)"/>
      <rect x="18" y="70" width="40" height="55" rx="3" fill="#FFFFFF"/>
      <text x="38" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#153B5B" text-anchor="middle">SPARKLING</text>
      <text x="38" y="107" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#D9B56D" text-anchor="middle">JUICE 750ml</text>
    </g>

    <!-- Nastar Jar -->
    <g transform="translate(145, 65)">
      <rect x="0" y="25" width="85" height="95" rx="12" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
      <rect x="4" y="14" width="77" height="16" rx="5" fill="url(#gold)"/>
      <circle cx="28" cy="80" r="12" fill="#F5C344"/>
      <circle cx="56" cy="80" r="12" fill="#F5C344"/>
      <circle cx="42" cy="58" r="12" fill="#F5C344"/>
      <rect x="12" y="85" width="60" height="20" rx="4" fill="#153B5B"/>
      <text x="42" y="99" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">NASTAR WISMAN</text>
    </g>

    <!-- Kastengel Jar -->
    <g transform="translate(245, 75)">
      <rect x="0" y="25" width="80" height="85" rx="12" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
      <rect x="4" y="15" width="72" height="15" rx="5" fill="url(#gold)"/>
      <rect x="16" y="65" width="22" height="10" rx="2" fill="#FAD06C"/>
      <rect x="42" y="65" width="22" height="10" rx="2" fill="#FAD06C"/>
      <rect x="28" y="50" width="24" height="10" rx="2" fill="#FAD06C"/>
      <rect x="10" y="78" width="60" height="18" rx="4" fill="#278CC8"/>
      <text x="40" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">KASTENGEL EDAM</text>
    </g>

    <!-- Golden Emblem Card -->
    <g transform="translate(125, 140)">
      <rect width="150" height="80" rx="10" fill="#FFFFFF" stroke="url(#gold)" stroke-width="2"/>
      <text x="75" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#153B5B" text-anchor="middle">PAKET AL-KARIM</text>
      <text x="75" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#278CC8" text-anchor="middle">Parcel Lebaran Premium</text>
      <text x="75" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#D9B56D" text-anchor="middle">Rp 850.000</text>
    </g>

    <!-- Silk Bow -->
    <g transform="translate(200, 160)">
      <ellipse cx="-20" cy="-10" rx="22" ry="14" fill="url(#sky)" transform="rotate(-25)"/>
      <ellipse cx="20" cy="-10" rx="22" ry="14" fill="url(#sky)" transform="rotate(25)"/>
      <circle cx="0" cy="0" r="11" fill="url(#gold)"/>
    </g>
  </g>
</svg>
