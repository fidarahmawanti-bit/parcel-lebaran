<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF8FD"/>
      <stop offset="100%" stop-color="#E2F2FB"/>
    </linearGradient>
    <linearGradient id="basket" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7A977"/>
      <stop offset="100%" stop-color="#A56E37"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69BCEB"/>
      <stop offset="100%" stop-color="#278CC8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#p2Bg)"/>

  <!-- Badge -->
  <g transform="translate(30, 25)">
    <rect width="180" height="30" rx="15" fill="#278CC8"/>
    <text x="90" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">KELUARGA &amp; PERSONAL</text>
  </g>

  <!-- Woven Hamper & Warm Gift presentation -->
  <g transform="translate(130, 80)">
    <path d="M40 160L65 310C68 320 80 325 95 325H245C260 325 272 320 275 310L300 160H40Z" fill="url(#basket)"/>
    <path d="M60 190H280M70 230H270M80 270H260" stroke="#7E4D1D" stroke-width="2" opacity="0.4"/>

    <!-- Jars inside basket -->
    <rect x="75" y="90" width="75" height="90" rx="10" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
    <rect x="78" y="80" width="69" height="15" rx="4" fill="#D9B56D"/>
    <circle cx="95" cy="135" r="10" fill="#F5C344"/>
    <circle cx="120" cy="135" r="10" fill="#F5C344"/>
    <circle cx="108" cy="115" r="10" fill="#F5C344"/>

    <rect x="175" y="100" width="70" height="80" rx="10" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
    <rect x="178" y="90" width="64" height="15" rx="4" fill="#69BCEB"/>
    <rect x="190" y="130" width="18" height="8" rx="2" fill="#FAD06C"/>
    <rect x="215" y="130" width="18" height="8" rx="2" fill="#FAD06C"/>

    <!-- Silk ribbon on basket -->
    <g transform="translate(170, 160)">
      <ellipse cx="-20" cy="-10" rx="24" ry="14" fill="url(#sky)" transform="rotate(-15)"/>
      <ellipse cx="20" cy="-10" rx="24" ry="14" fill="url(#sky)" transform="rotate(15)"/>
      <circle cx="0" cy="0" r="12" fill="#D9B56D"/>
    </g>

    <!-- Warm Greeting Card -->
    <g transform="translate(190, 210)">
      <rect width="130" height="70" rx="8" fill="#FFFFFF" stroke="#278CC8" stroke-width="1.5"/>
      <text x="65" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#153B5B" text-anchor="middle">Keluarga Bpk. Santoso</text>
      <text x="65" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#607586" text-anchor="middle">Hantaran Silaturahmi</text>
      <text x="65" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#237A57" text-anchor="middle">✓ Terkirim ke Surabaya</text>
    </g>
  </g>
</svg>
