<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF8FD"/>
      <stop offset="60%" stop-color="#E2F2FB"/>
      <stop offset="100%" stop-color="#D5ECF8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69BCEB"/>
      <stop offset="100%" stop-color="#278CC8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEECB"/>
      <stop offset="50%" stop-color="#D9B56D"/>
      <stop offset="100%" stop-color="#AA7F32"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bGrad)"/>

  <!-- Left: Guide Infographic elements -->
  <g transform="translate(60, 60)">
    <!-- Checklist / Notebook Icon -->
    <rect x="0" y="20" width="280" height="290" rx="16" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
    <rect x="0" y="20" width="280" height="45" rx="16" fill="#153B5B"/>
    <text x="30" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">CHECKLIST PARCEL LEBARAN</text>

    <!-- Checklist rows -->
    <g transform="translate(25, 90)">
      <circle cx="12" cy="12" r="10" fill="#237A57"/>
      <text x="12" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="32" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#153B5B">Tentukan Siapa Penerima</text>

      <circle cx="12" cy="46" r="10" fill="#237A57"/>
      <text x="12" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="32" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#153B5B">Alokasi Anggaran (Budget)</text>

      <circle cx="12" cy="80" r="10" fill="#237A57"/>
      <text x="12" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="32" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#153B5B">Cek Expired Date &amp; Halal</text>

      <circle cx="12" cy="114" r="10" fill="#237A57"/>
      <text x="12" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="32" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#153B5B">Pilih Kemasan Kuat &amp; Rapi</text>

      <circle cx="12" cy="148" r="10" fill="#237A57"/>
      <text x="12" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="32" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#153B5B">Pesan Maksimal H-10</text>
    </g>
  </g>

  <!-- Right: Comparison Jars & Gift box -->
  <g transform="translate(420, 80)">
    <!-- Hamper Box preview -->
    <rect x="20" y="140" width="280" height="150" rx="14" fill="#153B5B"/>
    <rect x="140" y="140" width="24" height="150" fill="url(#gold)"/>

    <!-- Jars on top -->
    <g transform="translate(50, 45)">
      <rect x="0" y="20" width="70" height="85" rx="10" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
      <rect x="4" y="10" width="62" height="14" rx="4" fill="url(#gold)"/>
      <circle cx="25" cy="60" r="11" fill="#F5C344"/>
      <circle cx="45" cy="60" r="11" fill="#F5C344"/>
      <text x="35" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#153B5B" text-anchor="middle">NASTAR</text>
    </g>

    <g transform="translate(150, 35)">
      <rect x="0" y="20" width="70" height="95" rx="10" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="2"/>
      <rect x="4" y="10" width="62" height="14" rx="4" fill="#69BCEB"/>
      <rect x="15" y="55" width="18" height="9" rx="2" fill="#FAD06C"/>
      <rect x="37" y="55" width="18" height="9" rx="2" fill="#FAD06C"/>
      <text x="35" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#153B5B" text-anchor="middle">KASTENGEL</text>
    </g>

    <!-- Silk Bow -->
    <g transform="translate(152, 140)">
      <ellipse cx="-18" cy="-8" rx="20" ry="12" fill="url(#sky)" transform="rotate(-15)"/>
      <ellipse cx="18" cy="-8" rx="20" ry="12" fill="url(#sky)" transform="rotate(15)"/>
      <circle cx="0" cy="0" r="10" fill="url(#gold)"/>
    </g>
  </g>

  <!-- Title Banner -->
  <g transform="translate(60, 380)">
    <rect width="680" height="42" rx="10" fill="#FFFFFF" stroke="#DCEAF2" stroke-width="1"/>
    <text x="340" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#153B5B" text-anchor="middle">Panduan Memilih Parcel Lebaran: Ekonomis vs Premium vs Korporat</text>
  </g>
</svg>
